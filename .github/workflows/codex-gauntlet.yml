name: Codex Gauntlet v6

on:
  pull_request:
  push:
    branches: [main, win]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      audit:
        description: Run repository-wide audit
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name != 'schedule' && !(github.event_name == 'workflow_dispatch' && inputs.audit)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Canonical diff-scoped verification
        env:
          CODEX_GAUNTLET_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: powershell
        run: '& ./qa/verify.ps1 -Mode ci'
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-gauntlet-v6-artifacts
          path: |
            .qa-artifacts/
            artifacts/metrics/
            artifacts/verification/evidence/
            artifacts/verification/receipts/
            qa/security/reports/
          if-no-files-found: ignore
          retention-days: 7

  audit:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.audit)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Canonical repository audit
        shell: powershell
        run: '& ./qa/verify.ps1 -Mode audit'
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-gauntlet-v6-audit
          path: |
            .qa-artifacts/
            artifacts/metrics/
            artifacts/verification/evidence/
            artifacts/verification/receipts/
            qa/security/reports/
          if-no-files-found: ignore
          retention-days: 14
