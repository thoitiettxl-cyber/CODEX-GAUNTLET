[tracking]
enabled = false
history_days = 30
# RTK v0.43.0 parses `enabled` but its recording path does not honor it.
# Sink the optional local history so full commands are never persisted.
database_path = "/dev/null"

[display]
colors = false
emoji = false
max_width = 160

[filters]
ignore_dirs = [".git", "node_modules", "target", "__pycache__", ".venv"]
ignore_files = []

[tee]
enabled = true
mode = "failures"
max_files = 50
max_file_size = 4194304

[telemetry]
enabled = false
consent_given = false

[hooks]
# Preserve exact output if RTK is later connected through an automatic hook.
exclude_commands = [
  "cat",
  "head",
  "tail",
  "sed",
  "awk",
  "jq",
  "rg",
  "grep",
  "find",
  "ls",
  "git status",
  "git diff",
  "git show",
  "git log",
  "git add",
  "git commit",
  "git push",
  "git pull",
  "git rebase",
  "git cherry-pick",
  "curl",
  "wget",
  "gh",
  "./qa/verify",
  "scripts/termux-control",
]
transparent_prefixes = []

[limits]
grep_max_results = 500
grep_max_per_file = 100
status_max_files = 100
status_max_untracked = 100
passthrough_max_chars = 10000
